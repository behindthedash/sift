name: Publish Sift to npm

# Protected main publishes version bumps using npm Trusted Publishing (OIDC).
# Every version runs through validation before automatic public publication.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/npm-stage.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version in package.json, e.g. 0.1.0'
        type: string
        required: true
      confirmation:
        description: 'Type STAGE to explicitly stage this version'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sift-npm-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: Detect npm release version bump
    runs-on: ubuntu-latest
    outputs:
      should_stage: ${{ steps.release.outputs.should_stage }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release and detect staging intent
        id: release
        env:
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REPOSITORY !== 'behindthedash/sift' ||
              process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Releases are allowed only from protected main in behindthedash/sift');
          }
          if (pkg.name !== '@sift-grid/react' || pkg.private === true ||
              !/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error('Expected a public @sift-grid/react package with a stable semver version');
          }

          let shouldStage = false;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            if (process.env.RELEASE_CONFIRMATION !== 'STAGE' ||
                process.env.RELEASE_VERSION !== pkg.version) {
              throw new Error('Manual release requires STAGE and the exact package.json version');
            }
            shouldStage = true;
          } else if (process.env.GITHUB_EVENT_NAME === 'push') {
            const before = process.env.PREVIOUS_MAIN_SHA ?? '';
            if (!/^[0-9a-f]{40}$/.test(before) || /^0+$/.test(before)) {
              throw new Error('Cannot verify the previous main SHA: refusing automatic staging');
            }
            const getPreviousFile = (path) => {
              try {
                return execFileSync('git', ['show', `${before}:${path}`], {
                  encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'],
                });
              } catch {
                return null;
              }
            };
            const previousWorkflow = getPreviousFile('.github/workflows/npm-stage.yml');
            const previousPackageText = getPreviousFile('package.json');
            if (!previousPackageText) {
              throw new Error('Cannot compare against the previous package.json');
            }
            const previousPackage = JSON.parse(previousPackageText);
            if (previousPackage.name !== pkg.name) {
              throw new Error('Package identity changed; review before releasing');
            }
            // The merge introducing this workflow is the first release trigger.
            // Subsequent merges trigger staging only when package.json.version changes.
            shouldStage = previousWorkflow === null || previousPackage.version !== pkg.version;
          } else {
            throw new Error('Unsupported release event');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `should_stage=${shouldStage}\nversion=${pkg.version}\n`);
          console.log(shouldStage
            ? `Release candidate: ${pkg.name}@${pkg.version} (OIDC direct publish)`
            : `No version change: skipping publication for ${pkg.name}@${pkg.version}`);
          NODE

  stage:
    name: Test, build and publish new npm version
    if: needs.preflight.outputs.should_stage == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use npm CLI with staged publishing support
        run: npm install --global npm@11
      - name: Install dependencies without publishing credentials
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build the distributable
        run: npm run build
      - name: Verify the npm tarball contents
        run: npm run release:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Check public registry metadata with no npm secrets or tokens.
      # This prevents accidental republishing of the same immutable version.
      - name: Skip versions already published on npm
        id: version_check
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageName = '@sift-grid/react';
          const version = process.env.RELEASE_VERSION;
          const registryUrl = `https://registry.npmjs.org/${encodeURIComponent(packageName)}`;
          const response = await fetch(registryUrl, {
            headers: { Accept: 'application/vnd.npm.install-v1+json' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            throw new Error(`npm registry version check failed (${response.status}); refusing to stage`);
          }
          const metadata = await response.json();
          if (metadata.name !== packageName || !metadata.versions || typeof metadata.versions !== 'object') {
            throw new Error('Unexpected npm registry metadata; refusing to stage');
          }
          const alreadyPublished = Object.hasOwn(metadata.versions, version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `skip_stage=${alreadyPublished}\n`);
          console.log(alreadyPublished
            ? `${packageName}@${version} is already public; skipping`
            : `${packageName}@${version} is not yet public; proceeding with OIDC publication`);
          NODE
      - name: Publish with npm trusted publishing (OIDC)
        if: steps.version_check.outputs.skip_stage != 'true'
        run: |
          set -euo pipefail
          # GitHub's ephemeral OIDC identity is exchanged by npm CLI itself.
          # npm must allow direct publishing for this exact workflow + environment.
          # No legacy token fallback and no manual npm approval step.
          npm publish --access public --provenance --ignore-scripts
